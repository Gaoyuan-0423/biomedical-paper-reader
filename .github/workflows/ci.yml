name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Link, anchor and recorded-artifact integrity
        run: |
          python3 evals/validate_repo.py --self-test
          python3 evals/validate_repo.py
      - name: Reading-record validator regression
        run: python3 evals/test_reading_record.py -v
      - name: Release metadata regression
        run: python3 evals/test_prepare_release.py -v
      - name: Frontend syntax and async reading regressions
        run: |
          node --check app/frontend/app.js
          node --check app/frontend/export.js
          node --check app/frontend/evidence.js
          node --check app/frontend/resources.js
          node --check app/frontend/chat.js
          node --test app/tests/test_frontend.cjs app/tests/test_evidence.cjs app/tests/test_resources.cjs app/tests/test_chat.cjs
      - name: Helper scripts compile
        run: python3 -m py_compile scripts/check_reading_record.py scripts/render_pdf_page.py scripts/prepare_release.py

  desktop-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install app test dependencies
        run: python -m pip install -r app/backend/requirements.txt 'pywebview>=6.2.1,<7'
      - name: Desktop service and storage regressions (no GUI)
        run: python -m unittest discover -s app/tests -v
