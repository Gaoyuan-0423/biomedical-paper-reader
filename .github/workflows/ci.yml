name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Link, anchor and recorded-artifact integrity
        run: python3 evals/validate_repo.py
      - name: Reading-record validator regression
        run: python3 evals/test_reading_record.py -v
      - name: Helper scripts compile
        run: python3 -m py_compile scripts/check_reading_record.py scripts/render_pdf_page.py
